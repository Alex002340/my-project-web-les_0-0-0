<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інтерактивний тест: Лабораторно-практична робота №2</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --accent-blue: #2980b9;
            --accent-green: #27ae60;
            --accent-red: #e74c3c;
            --accent-orange: #f39c12;
            --accent-purple: #8e44ad;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --border-color: #dcdde1;
            --shadow: 0 12px 35px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .test-wrapper {
            width: 100%;
            max-width: 920px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 3px solid #2c3e50;
            overflow: hidden;
            position: relative;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            border-bottom: 4px solid var(--accent-orange);
        }

        .header-icon-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .hand-drawn-icon {
            width: 48px;
            height: 48px;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            filter: drop-shadow(2px 3px 0px rgba(0,0,0,0.2));
            transition: transform 0.3s ease;
        }

        .hand-drawn-icon:hover {
            transform: scale(1.15) rotate(-5deg);
        }

        .icon-blue { stroke: var(--accent-blue); }
        .icon-green { stroke: var(--accent-green); }
        .icon-orange { stroke: var(--accent-orange); }
        .icon-purple { stroke: var(--accent-purple); }
        .icon-red { stroke: var(--accent-red); }

        .header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 500;
        }

        .content { padding: 35px; }

        #user-info-form .form-group {
            margin: 0 auto 22px auto;
            max-width: 480px;
        }

        #user-info-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 1rem;
            color: var(--primary);
        }

        #user-info-form input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--primary);
            border-radius: 14px;
            font-size: 1.05rem;
            font-family: 'Montserrat', sans-serif;
            background: #fff;
            outline: none;
            box-shadow: 3px 3px 0px var(--primary);
            transition: all 0.2s ease;
        }

        #user-info-form input:focus {
            box-shadow: 5px 5px 0px var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            background: var(--accent-blue);
            color: white;
            padding: 14px 36px;
            border: 2.5px solid var(--primary);
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.2s ease;
            box-shadow: 4px 4px 0px var(--primary);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--primary);
            background: #2980b9;
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--primary);
        }

        .save-btn {
            background: var(--accent-purple);
        }

        .save-btn:hover {
            background: #7d3c98;
        }

        #quiz-container { display: none; }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .progress-bar {
            width: 100%;
            height: 14px;
            background-color: #e2e8f0;
            border: 2px solid var(--primary);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 2px 2px 0px var(--primary);
        }

        .progress-bar-inner {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            transition: width 0.4s ease;
        }

        .question-block {
            background: #ffffff;
            padding: 28px;
            border-radius: 18px;
            border: 2.5px solid var(--primary);
            box-shadow: 5px 5px 0px rgba(44, 62, 80, 0.15);
        }

        .question-header {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 20px;
        }

        .question-icon {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            stroke-width: 2.5;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.45;
            flex-grow: 1;
        }

        .question-points {
            background: #ebf5fb;
            color: var(--accent-blue);
            border: 2px solid var(--accent-blue);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .answers label {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            background: #fafafa;
        }

        .answers label:hover {
            border-color: var(--accent-blue);
            background-color: #f0f7fc;
            transform: translateX(4px);
        }

        .answers input[type="radio"],
        .answers input[type="checkbox"] {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2.5px solid var(--primary);
            border-radius: 6px;
            margin-right: 14px;
            outline: none;
            cursor: pointer;
            display: grid;
            place-content: center;
            transition: all 0.2s ease;
            background: white;
            flex-shrink: 0;
        }

        .answers input[type="radio"] {
            border-radius: 50%;
        }

        .answers input[type="radio"]:checked,
        .answers input[type="checkbox"]:checked {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .answers input[type="radio"]:checked::before {
            content: "";
            width: 8px;
            height: 8px;
            background-color: white;
            border-radius: 50%;
        }

        .answers input[type="checkbox"]:checked::before {
            content: "✓";
            color: white;
            font-size: 14px;
            font-weight: 900;
        }

        .answers label:has(input:checked) {
            border-color: var(--accent-blue);
            background-color: #ebf5fb;
            font-weight: 600;
            box-shadow: 3px 3px 0px var(--accent-blue);
        }

        .matching-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        @media (max-width: 680px) {
            .matching-grid { grid-template-columns: 1fr; }
        }

        .matching-pair {
            background: #f8f9fa;
            border: 2px dashed var(--primary);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .matching-left {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--primary);
        }

        .matching-select {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--accent-blue);
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            outline: none;
            background: white;
        }

        .sequence-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sequence-item {
            position: relative;
            padding: 16px 20px;
            background-color: #f8f9fa;
            border: 2px solid var(--primary);
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sequence-item:hover {
            border-color: var(--accent-purple);
            background-color: #f5eeef;
        }

        .sequence-item.selected {
            border-color: var(--accent-purple);
            background-color: #f4ecf7;
            box-shadow: 3px 3px 0px var(--accent-purple);
        }

        .sequence-order-badge {
            width: 32px;
            height: 32px;
            background: var(--accent-purple);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 0.95rem;
            border: 2px solid var(--primary);
        }

        #results-container { display: none; }

        .results-card {
            background: #ffffff;
            border: 3px solid var(--primary);
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            box-shadow: 6px 6px 0px var(--primary);
        }

        .results-badge-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px auto;
        }

        .score-value {
            font-size: 4.8rem;
            font-weight: 900;
            color: var(--accent-blue);
            line-height: 1;
            margin: 15px 0;
            font-family: 'Caveat', cursive;
        }

        .score-details {
            font-size: 1.1rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 20px;
        }

        .status-badge {
            padding: 10px 28px;
            border-radius: 50px;
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            display: inline-block;
            border: 2px solid var(--primary);
            box-shadow: 3px 3px 0px var(--primary);
            margin-bottom: 25px;
        }

        .status-passed { background: var(--accent-green); }
        .status-failed { background: var(--accent-red); }

        .level-description {
            background: #f8f9fa;
            border: 2px solid var(--border-color);
            padding: 20px;
            border-radius: 14px;
            margin-top: 20px;
            text-align: left;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .level-description h4 {
            color: var(--primary);
            margin-bottom: 8px;
            font-weight: 800;
        }
    </style>
</head>
<body>

<div class="test-wrapper">
    <div class="header">
        <div class="header-icon-container">
            <svg class="hand-drawn-icon icon-orange" viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="M12 8v4m0 4h.01"/>
            </svg>
            <svg class="hand-drawn-icon icon-blue" viewBox="0 0 24 24">
                <circle cx="12" cy="5" r="2"/>
                <path d="M12 7l-6 14m6-14l6 14m-9-5h6"/>
            </svg>
            <svg class="hand-drawn-icon icon-purple" viewBox="0 0 24 24">
                <path d="M12 2l8.66 5v10L12 22l-8.66-5V7z"/>
                <circle cx="12" cy="12" r="4"/>
            </svg>
        </div>
        <h1>Лабораторно-практична робота №2</h1>
        <p>Інструктаж з БЖД. Відшукання центрів кіл. Поділ кола на рівні частини</p>
    </div>

    <div class="content">
        <div id="user-info-form">
            <div class="form-group">
                <label for="student-name">Прізвище та Ім'я здобувача освіти:</label>
                <input type="text" id="student-name" placeholder="Наприклад: Коваленко Олексій" required>
            </div>
            <div class="form-group">
                <label for="student-group">Навчальна група / Клас:</label>
                <input type="text" id="student-group" placeholder="Наприклад: Група СЛ-21" required>
            </div>
            <div class="button-container">
                <button type="button" class="btn" onclick="startQuiz()">
                    Розпочати тест
                    <svg style="width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.5;" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </div>
        </div>

        <div id="quiz-container">
            <div class="progress-info">
                <span id="question-number">Питання 1 з 15</span>
                <span id="score-tracker">Бали: 0</span>
            </div>
            <div class="progress-bar">
                <div class="progress-bar-inner" id="progress-bar-fill"></div>
            </div>

            <div id="question-card" class="question-block"></div>

            <div class="button-container">
                <button type="button" class="btn" id="next-btn" onclick="submitAnswer()">
                    Наступне питання
                    <svg style="width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.5;" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </div>
        </div>

        <div id="results-container">
            <div class="results-card">
                <svg class="hand-drawn-icon icon-green results-badge-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M8 12l3 3 5-6"/>
                </svg>
                <h2>Результати тестування</h2>
                <div class="score-value" id="final-grade">12 балів</div>
                <div class="score-details" id="score-details-text">Набрано 37 з 37 умовних балів (100%)</div>
                <div id="status-badge-container"></div>
                <div class="level-description" id="level-description-text"></div>

                <div class="button-container" style="margin-top: 25px;">
                    <button type="button" class="btn save-btn" onclick="downloadReport()">💾 Зберегти звіт у HTML</button>
                    <button type="button" class="btn" onclick="location.reload()">🔄 Пройти знову</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const questions = [
        {
            type: "single", points: 1,
            icon: `<svg class="question-icon icon-orange" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4m0 4h.01"/></svg>`,
            question: "Як правильно передавати колючі розмічальні інструменти (рисувалки, циркулі, кернери) іншому робітнику?",
            options: [
                "Гострими кінцями від себе, ручкою до того, кому передаєш",
                "Ручкою від себе, гострими кінцями до себе",
                "Будь-яким зручним способом у відкритій долоні",
                "Поклавши на підлогу або верстак для самостійного взяття"
            ],
            correct: 0
        },
        {
            type: "single", points: 1,
            icon: `<svg class="question-icon icon-orange" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4m0 4h.01"/></svg>`,
            question: "Яким чином згідно з правилами БЖД слід прибирати стружку та тирсу з розмічальної плити чи верстака?",
            options: [
                "Здувати ротом у напрямку від себе",
                "Змітати голими руками в контейнер",
                "Використовувати тільки спеціальну щітку-зміталку",
                "Вайтувати за допомогою стисненого повітря без окулярів"
            ],
            correct: 2
        },
        {
            type: "single", points: 1,
            icon: `<svg class="question-icon icon-orange" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4m0 4h.01"/></svg>`,
            question: "Що обов'язково необхідно одягнути перед встановленням або зніманням важких заготовок на розмічальну плиту?",
            options: [
                "Брезентові або захисні рукавиці",
                "Діелектричні гумові рукавички",
                "Бавовняні нарукавники",
                "Захисні окуляри з сіткою"
            ],
            correct: 0
        },
        {
            type: "single", points: 1,
            icon: `<svg class="question-icon icon-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>`,
            question: "Графічний метод відшукання центра кола за допомогою хорд ґрунтується на побудові:",
            options: [
                "Дотичних прямих під кутом 45°",
                "Серединних перпендикулярів до двох непаралельних хорд",
                "Паралельних ліній по краях кола",
                "Бісектрис зовнішніх кутів квадрата"
            ],
            correct: 1
        },
        {
            type: "single", points: 1,
            icon: `<svg class="question-icon icon-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z"/><circle cx="12" cy="12" r="3"/></svg>`,
            question: "Який спеціальний пристрій застосовують для швидкого відшукання центра на торці циліндричної заготовки?",
            options: [
                "Штангенрейсмус із мікрогвинтом",
                "Кутник-центрошукач",
                "Розмічальний транспортир",
                "Триногий кернер"
            ],
            correct: 1
        },
        {
            type: "single", points: 1,
            icon: `<svg class="question-icon icon-purple" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="12 2 2 22 22 22"/><circle cx="12" cy="14" r="2"/></svg>`,
            question: "При поділі кола на 3 рівні частини з точки перетину осі з колом проводять дугу радіусом:",
            options: [
                "Радіусом, що дорівнює половині радіуса даного кола (0.5R)",
                "Радіусом, що дорівнює діаметру кола (D)",
                "Радіусом, що дорівнює радіусу даного кола (R)",
                "Довільним радіусом на око"
            ],
            correct: 2
        },
        {
            type: "matching", points: 4,
            icon: `<svg class="question-icon icon-purple" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>`,
            question: "Установіть відповідність між геометричною фігурою (або задачею) та графічним способом її побудови:",
            left: [
                "1. Вписаний правильний трикутник",
                "2. Вписаний правильний квадрат",
                "3. Вписаний правильний шестикутник",
                "4. Центр довільного кола"
            ],
            rightOptions: [
                "А. Поділ кола радіусом R з однієї точки перетину осі з колом",
                "Б. З'єднання точок перетину взаємно перпендикулярних осей з колом",
                "В. Поділ кола радіусом R з двох протилежних точок осі",
                "Г. Точка перетину серединних перпендикулярів до двох хорд",
                "Д. Проведення дотичних під кутом 30°"
            ],
            correctMap: { 0: 0, 1: 1, 2: 2, 3: 3 }
        },
        {
            type: "single", points: 1,
            icon: `<svg class="question-icon icon-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/></svg>`,
            question: "На скільки рівних частин ділять коло дві взаємно перпендикулярні центрові осі?",
            options: [
                "На 2 частини",
                "На 3 частини",
                "На 4 частини",
                "На 6 частин"
            ],
            correct: 2
        },
        {
            type: "single", points: 1,
            icon: `<svg class="question-icon icon-purple" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="7"/></svg>`,
            question: "Чому дорівнює довжина сторони правильного вписаного шестикутника в коло радіуса R?",
            options: [
                "Дорівнює діаметру кола (2R)",
                "Дорівнює радіусу даного кола (R)",
                "Дорівнює половині радіуса (0.5R)",
                "Дорівнює 1.5R"
            ],
            correct: 1
        },
        {
            type: "sequence", points: 3,
            icon: `<svg class="question-icon icon-green" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z"/><path d="M12 6v12M6 9l12 6"/></svg>`,
            question: "Установіть правильну послідовність побудови вписаного шестикутника (натискайте елементи по порядку від 1 до 4):",
            items: [
                "Проведення взаємно перпендикулярних центрових осей та кола радіусом R",
                "Встановлення голки циркуля у точку перетину осі з колом",
                "Проведення дуг радіусом R з двох протилежних точок осі до перетину з колом",
                "Послідовне з'єднання шести утворених точок відрізками прямих"
            ],
            correctOrder: [0, 1, 2, 3]
        },
        {
            type: "multiple", points: 3,
            icon: `<svg class="question-icon icon-orange" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>`,
            question: "Укажіть ТРИ правильні правила безпеки праці під час виконання розмічальних робіт (виберіть 3 відповіді):",
            options: [
                "Не носити гострі розмічальні інструменти в кишенях робочого одягу",
                "Установлювати заготовки та пристрої ближче до середини розмічальної плити",
                "Прибирати стружку та тирсу тільки щіткою-зміталкою",
                "Здувати стружку ротом у напрямку сусіда по верстаку",
                "Класти рисувалку та циркуль у кишеню під час перерви",
                "Працювати молотком із послабленою або розтрісканою рукояткою",
                "Залишати заготовки на краю плити без фіксації"
            ],
            correct: [0, 1, 2]
        },
        {
            type: "single", points: 1,
            icon: `<svg class="question-icon icon-orange" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 19l7-73-3-7-7 7 3 3z"/><path d="M18 13l-1.5-1.5"/></svg>`,
            question: "Як правильно встановлювати кернер на розмічальну риску перед ударом молотком?",
            options: [
                "Тримати строго вертикально від самого початку",
                "Нахилити від себе для точного потрапляння в точку, а потім випрямити вертикально",
                "Нахилити вбік під кутом 45° і нанести сильний удар",
                "Установити горизонтально до поверхні заготовки"
            ],
            correct: 1
        },
        {
            type: "sequence", points: 3,
            icon: `<svg class="question-icon icon-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M7 12l10 0M12 7l0 10"/></svg>`,
            question: "Установіть послідовність дій при відшуканні центра кола методом хорд (від 1 до 4):",
            items: [
                "Проведення двох довільних непаралельних хорд AB і CD",
                "Поділ кожної з двох хорд навпіл за допомогою циркуля",
                "Проведення серединних перпендикулярів до кожної хорди",
                "Знаходження точки перетину перпендикулярів (шуканий центр O)"
            ],
            correctOrder: [0, 1, 2, 3]
        },
        {
            type: "single", points: 1,
            icon: `<svg class="question-icon icon-purple" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>`,
            question: "Для чого використовують центровий маркер (або триногий кернер) при розмічальних роботах?",
            options: [
                "Для швидкого нанесення паралельних ліній",
                "Для точного накернювання центрів отворів без зсуву",
                "Для фарбування поверхні заготовки мідним купоросом",
                "Для перевірки горизонтальності плити"
            ],
            correct: 1
        },
        {
            type: "multiple", points: 3,
            icon: `<svg class="question-icon icon-purple" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>`,
            question: "Які інструменти необхідні для графічного поділу кола на 6 рівних частин на папері? (Виберіть 3 відповіді):",
            options: [
                "Креслярський або розмічальний циркуль",
                "Креслярська лінійка або кутник",
                "Загострений простий олівець (або рисувалка)",
                "Ватерпас із градусною шкалою",
                "Мікрометр гладкий",
                "Слюсарний молоток масою 500 г",
                "Зубило канавочне"
            ],
            correct: [0, 1, 2]
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let studentData = { name: "", group: "", answers: [] };
    let sequenceSelection = [];

    function startQuiz() {
        const name = document.getElementById("student-name").value.trim();
        const group = document.getElementById("student-group").value.trim();

        if (!name || !group) {
            alert("Будь ласка, заповніть Прізвище, Ім'я та Групу!");
            return;
        }

        studentData.name = name;
        studentData.group = group;

        document.getElementById("user-info-form").style.display = "none";
        document.getElementById("quiz-container").style.display = "block";

        renderQuestion();
    }

    function renderQuestion() {
        const q = questions[currentQuestion];
        const card = document.getElementById("question-card");
        
        document.getElementById("question-number").innerText = `Питання ${currentQuestion + 1} з ${questions.length}`;
        document.getElementById("score-tracker").innerText = `Бали: ${score}`;
        const progressPct = ((currentQuestion) / questions.length) * 100;
        document.getElementById("progress-bar-fill").style.width = `${progressPct}%`;

        let html = `
            <div class="question-header">
                ${q.icon}
                <div class="question-title">${q.question}</div>
                <div class="question-points">${q.points} б.</div>
            </div>
        `;

        if (q.type === "single") {
            html += `<div class="answers">`;
            q.options.forEach((opt, idx) => {
                html += `
                    <label>
                        <input type="radio" name="answer" value="${idx}">
                        <span>${opt}</span>
                    </label>
                `;
            });
            html += `</div>`;
        } else if (q.type === "multiple") {
            html += `<div class="answers">`;
            q.options.forEach((opt, idx) => {
                html += `
                    <label>
                        <input type="checkbox" name="answer" value="${idx}">
                        <span>${opt}</span>
                    </label>
                `;
            });
            html += `</div>`;
        } else if (q.type === "matching") {
            html += `<div class="matching-grid">`;
            q.left.forEach((item, idx) => {
                html += `
                    <div class="matching-pair">
                        <div class="matching-left">${item}</div>
                        <select class="matching-select" id="match-${idx}">
                            <option value="">-- Оберіть варіант --</option>
                            ${q.rightOptions.map((opt, oIdx) => `<option value="${oIdx}">${opt}</option>`).join('')}
                        </select>
                    </div>
                `;
            });
            html += `</div>`;
        } else if (q.type === "sequence") {
            sequenceSelection = [];
            html += `<div class="sequence-list">`;
            q.items.forEach((item, idx) => {
                html += `
                    <div class="sequence-item" id="seq-item-${idx}" onclick="toggleSequence(${idx})">
                        <span>${item}</span>
                        <div class="sequence-order-badge" id="seq-badge-${idx}" style="display:none;"></div>
                    </div>
                `;
            });
            html += `</div>`;
        }

        card.innerHTML = html;
    }

    function toggleSequence(idx) {
        const itemEl = document.getElementById(`seq-item-${idx}`);
        const badgeEl = document.getElementById(`seq-badge-${idx}`);

        const existingPos = sequenceSelection.indexOf(idx);
        if (existingPos !== -1) {
            sequenceSelection.splice(existingPos, 1);
            itemEl.classList.remove("selected");
            badgeEl.style.display = "none";
        } else {
            sequenceSelection.push(idx);
            itemEl.classList.add("selected");
            badgeEl.style.display = "flex";
            badgeEl.innerText = sequenceSelection.length;
        }

        sequenceSelection.forEach((sIdx, pos) => {
            document.getElementById(`seq-badge-${sIdx}`).innerText = pos + 1;
        });
    }

    function submitAnswer() {
        const q = questions[currentQuestion];
        let earned = 0;

        if (q.type === "single") {
            const selected = document.querySelector('input[name="answer"]:checked');
            if (!selected) { alert("Будь ласка, оберіть відповідь!"); return; }
            if (parseInt(selected.value) === q.correct) earned = q.points;
        } else if (q.type === "multiple") {
            const checked = Array.from(document.querySelectorAll('input[name="answer"]:checked')).map(el => parseInt(el.value));
            if (checked.length === 0) { alert("Будь ласка, оберіть хоча б одну відповідь!"); return; }
            
            const isCorrect = checked.length === q.correct.length && checked.every(val => q.correct.includes(val));
            if (isCorrect) earned = q.points;
            else {
                let correctCount = checked.filter(val => q.correct.includes(val)).length;
                if (correctCount > 0) earned = Math.max(0, correctCount - (checked.length - correctCount));
            }
        } else if (q.type === "matching") {
            let correctCount = 0;
            for (let i = 0; i < q.left.length; i++) {
                const val = document.getElementById(`match-${i}`).value;
                if (val === "") { alert("Будь ласка, заповніть усі пара відповідностей!"); return; }
                if (parseInt(val) === q.correctMap[i]) correctCount++;
            }
            earned = correctCount;
        } else if (q.type === "sequence") {
            if (sequenceSelection.length !== q.items.length) {
                alert("Будь ласка, вкажіть порядок для всіх 4-х елементів!");
                return;
            }
            let isExact = sequenceSelection.every((val, index) => val === q.correctOrder[index]);
            if (isExact) earned = q.points;
            else {
                let matchCount = sequenceSelection.filter((val, index) => val === q.correctOrder[index]).length;
                if (matchCount >= 2) earned = 1;
            }
        }

        score += earned;
        studentData.answers.push({ question: q.question, earned: earned, max: q.points });

        currentQuestion++;
        if (currentQuestion < questions.length) {
            renderQuestion();
        } else {
            showResults();
        }
    }

    function calculate12Grade(rawScore, maxScore = 37) {
        const pct = (rawScore / maxScore) * 100;
        if (pct >= 95) return 12;
        if (pct >= 88) return 11;
        if (pct >= 80) return 10;
        if (pct >= 73) return 9;
        if (pct >= 65) return 8;
        if (pct >= 57) return 7;
        if (pct >= 48) return 6;
        if (pct >= 39) return 5;
        if (pct >= 30) return 4;
        if (pct >= 20) return 3;
        if (pct >= 10) return 2;
        return 1;
    }

    function showResults() {
        document.getElementById("quiz-container").style.display = "none";
        document.getElementById("results-container").style.display = "block";

        const maxScore = 37;
        const grade12 = calculate12Grade(score, maxScore);
        const pct = Math.round((score / maxScore) * 100);

        document.getElementById("final-grade").innerText = `${grade12} балів`;
        document.getElementById("score-details-text").innerText = `Набрано ${score} з ${maxScore} умовних балів (${pct}%)`;

        const badgeContainer = document.getElementById("status-badge-container");
        const levelDesc = document.getElementById("level-description-text");

        if (grade12 >= 7) {
            badgeContainer.innerHTML = `<span class="status-badge status-passed">Тест складено (Достатній / Високий рівень)</span>`;
        } else {
            badgeContainer.innerHTML = `<span class="status-badge status-failed">Тест вимагає доопрацювання (Початковий / Середній рівень)</span>`;
        }

        let descHtml = `<h4>Оцінка здобувача освіти: ${studentData.name} (${studentData.group})</h4>`;
        if (grade12 >= 10) {
            descHtml += `<p><strong>Високий рівень:</strong> Здобувач освіти виявив бездоганні знання правил безпеки праці (БЖД), алгоритмів відшукання центрів кіл та покрокових методів побудови вписаного трикутника, квадрата і шестикутника.</p>`;
        } else if (grade12 >= 7) {
            descHtml += `<p><strong>Достатній рівень:</strong> Здобувач освіти добре орієнтується в графічних побудовах та техніці безпеки, припустившись незначних похибок у складних послідовностях.</p>`;
        } else if (grade12 >= 4) {
            descHtml += `<p><strong>Середній рівень:</strong> Засвоєно основні поняття БЖД та базовий поділ кола, проте наявні прогалини в графічних алгоритмах та послідовностях побудови.</p>`;
        } else {
            descHtml += `<p><strong>Початковий рівень:</strong> Матеріал засвоєно фрагментарно. Рекомендовано повторно опрацювати інструктаж БЖД та геометричні методи поділу кола.</p>`;
        }

        levelDesc.innerHTML = descHtml;
    }

    function downloadReport() {
        const maxScore = 37;
        const grade12 = calculate12Grade(score, maxScore);
        const pct = Math.round((score / maxScore) * 100);

        const reportHtml = `
            <!DOCTYPE html>
            <html lang="uk">
            <head>
                <meta charset="UTF-8">
                <title>Звіт: ${studentData.name} - Лабораторно-практична робота №2</title>
                <style>
                    body { font-family: Arial, sans-serif; padding: 30px; color: #2c3e50; }
                    h1 { color: #2c3e50; border-bottom: 3px solid #2980b9; padding-bottom: 10px; }
                    .info-card { background: #f8f9fa; padding: 20px; border-radius: 10px; border: 1px solid #dcdde1; margin-bottom: 20px; }
                    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
                    th, td { border: 1px solid #dcdde1; padding: 10px; text-align: left; }
                    th { background: #2c3e50; color: white; }
                    .badge { font-size: 1.4rem; font-weight: bold; color: #27ae60; }
                </style>
            </head>
            <body>
                <h1>Звіт проходження тестування</h1>
                <div class="info-card">
                    <p><strong>Здобувач освіти:</strong> ${studentData.name}</p>
                    <p><strong>Група:</strong> ${studentData.group}</p>
                    <p><strong>Дата виконання:</strong> ${new Date().toLocaleDateString('uk-UA')} ${new Date().toLocaleTimeString('uk-UA')}</p>
                    <p><strong>Оцінка за 12-бальною шкалою:</strong> <span class="badge">${grade12} балів</span></p>
                    <p><strong>Умовні бали:</strong> ${score} з ${maxScore} (${pct}%)</p>
                </div>
                <h2>Деталізація по питаннях</h2>
                <table>
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Питання</th>
                            <th>Отримано балів</th>
                            <th>Макс. бал</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${studentData.answers.map((a, i) => `
                            <tr>
                                <td>${i + 1}</td>
                                <td>${a.question}</td>
                                <td>${a.earned}</td>
                                <td>${a.max}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </body>
            </html>
        `;

        const blob = new Blob([reportHtml], { type: "text/html" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Report_Lab2_${studentData.name.replace(/\\s+/g, '_')}.html`;
        a.click();
        URL.revokeObjectURL(url);
    }
</script>
